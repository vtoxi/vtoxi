{"name": "Update years of experience", "on": {"schedule": [{"cron": "0 0 1 7 *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"update": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Update README", "run": "Y=$(( $(date +%Y) - 2015 )); sed -i -E \"s#(<!--YEARS-->)[0-9]+(<!--/YEARS-->)#\\1${Y}\\2#\" README.md"}, {"name": "Commit", "run": "git config user.name github-actions; git config user.email github-actions@github.com; git add README.md; git diff --cached --quiet || git commit -m 'Update years of experience'; git push"}]}}}
